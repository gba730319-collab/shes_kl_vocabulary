
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2-Advanced S11/S12 Vocabulary</title>
<style>
:root {
  --bg:#f3f6f4; --card:#fff; --ink:#16302a;
  --mute:#5d746c; --ac:#2f7d4f; --ac2:#d8ecdf;
  --line:#cfdcd5;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;
}
header {
  position:sticky; top:0; z-index:5;
  background:var(--ink); color:#fff; padding:12px 16px;
}
h1 { margin:0 0 8px; font-size:1.15rem; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.tg { display:inline-flex; gap:6px; align-items:center; cursor:pointer; }
select,input[type=search],input[type=number] {
  padding:6px 8px; border-radius:8px;
  border:1px solid #6f9a86; background:#fff; color:var(--ink);
}
.seg { display:inline-flex; border:1px solid #6f9a86; border-radius:8px; overflow:hidden; }
.seg button {
  background:transparent; color:#fff; border:0;
  padding:6px 12px; cursor:pointer;
}
.seg button[aria-pressed=true] { background:var(--ac); font-weight:700; }
main {
  max-width:1000px; margin:0 auto; padding:16px;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:10px;
}
.cw { position:relative; display:flex; }
.card {
  box-sizing:border-box; cursor:pointer; background:var(--card);
  border:1px solid var(--line); border-left:5px solid var(--ac);
  border-radius:6px; padding:10px 12px 32px;
  display:block; width:100%; min-width:0; min-height:112px;
  text-align:left; color:var(--ink); overflow-wrap:anywhere;
}
.card:hover,.card.on { background:var(--ac2); }
.card:focus-visible { outline:3px solid var(--ac); }
.n { float:right; color:var(--mute); font-size:.75rem; }
.w { font-size:1.3rem; font-weight:700; }
.p { color:var(--mute); font-size:.8rem; margin-left:6px; font-weight:400; }
.k { color:var(--ac); font-size:.9rem; }
.z { font-size:1rem; margin-top:2px; }
.s {
  margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
  font-size:.9rem; color:var(--mute);
}
.sz { display:block; margin-top:2px; }
body.nozh .z, body.nozh .sz { display:none; }
body.nose .s { display:none; }
body.nokk .k { display:none; }
.ck { position:absolute; right:7px; bottom:7px; cursor:pointer; }
.ck input { width:20px; height:20px; accent-color:var(--ac); }
.ex {
  background:#fff; color:var(--ink); border:0; border-radius:8px;
  padding:6px 12px; cursor:pointer; font-size:.9rem;
}
.ex.go { background:var(--ac); color:#fff; font-weight:700; }
#msg { max-width:1000px; margin:0 auto; padding:0 16px; color:var(--mute); font-size:.85rem; }
#pv { display:none; }
@media print {
  header,main,#msg { display:none!important; }
  body { background:#fff; }
  #pv { display:block; padding:0; }
  #pv h2 { font-size:16pt; }
  #pv table { width:100%; border-collapse:collapse; font-size:11pt; }
  #pv th,#pv td { border:1px solid #999; padding:4pt 6pt; text-align:left; }
  #pv th { background:#d8ecdf; }
  #pv tr { break-inside:avoid; }
  @page { margin:14mm; }
}
</style>
</head>
<body class="nozh nose">
<header>
  <h1>G2-Advanced S11/S12 Vocabulary（點一下聽發音）</h1>
  <div class="bar">
    <span class="seg">
      <button id="us" aria-pressed="true">美式</button>
      <button id="uk" aria-pressed="false">英式</button>
    </span>
    <label class="tg"><input type="checkbox" id="zh"> 中文</label>
    <label class="tg"><input type="checkbox" id="kk" checked> KK音標</label>
    <label class="tg"><input type="checkbox" id="se"> 例句</label>
    <label>語速
      <select id="sp">
        <option value=".6">慢</option>
        <option value=".85" selected>正常</option>
        <option value="1">快</option>
      </select>
    </label>
    <select id="rg" aria-label="範圍"></select>
    <input type="search" id="q" placeholder="搜尋英文或中文">
    <button class="ex" id="sa">全選目前範圍</button>
    <button class="ex" id="sall">全選 1–114</button>
    <button class="ex" id="sc">清除選取</button>
    <span class="tg">
      自訂範圍
      <input type="number" id="ra" min="1" max="150" placeholder="起" style="width:65px">
      到
      <input type="number" id="rb" min="1" max="150" placeholder="迄" style="width:65px">
      <button class="ex" id="radd">加入</button>
      <button class="ex" id="rdel">取消</button>
    </span>
    <label class="tg"><input type="checkbox" id="pz" checked> PDF含中文</label>
    <label class="tg"><input type="checkbox" id="ps" checked> PDF含例句</label>
    <button class="ex go" id="pd">匯出PDF（0）</button>
  </div>
</header>
<div id="msg"></div>
<main id="list"></main>
<div id="pv"></div>

<script>
const DATA = `take a shower|洗澡|phr.|I take a shower in the afternoon.

cage|牢籠|n.|The giant giraffe eats an orange in the cage.

reporter|記者|n.|Alex is a weather reporter for today.
search|尋找|v.|He searched Internet weather sites.
daytime|白天|n.|These clothes protect their skin from the hot sun in the daytime.
protect|保護|v.|These clothes protect their skin from the hot sun in the daytime.
strange|奇怪的|adj.|Sound a little strange?
concert|音樂會|n.|It is a series of outdoor concerts.
contest|比賽|n.|Mr. Ford was at the Dirtiest Car Contest.
judge|評審|n.|Judges checked his car.
prize|獎品|n.|Mr. Ford won first prize.
drop|掉落|v.|He just dropped them to the ground.
bucket|水桶|n.|Then I put them in buckets.`;

const W = DATA.trim().split("\n").map((line,i) => {
  const [w,z,p,s] = line.split("|");
  return {n:i+1,w,z,p,s};
});
const $ = id => document.getElementById(id);
const L = $("list");
const selected = new Set();
let accent = "en-US";
let shown = [];

const count = () => $("pd").textContent = `匯出PDF（${selected.size}）`;

$("rg").innerHTML =
  '<option value="0">全部 1–114</option>' +
  [1,2,3].map(i => {
    const a=(i-1)*40+1, b=Math.min(i*40,114);
    return `<option value="${a}">${a}–${b}</option>`;
  }).join("");

function render() {
  const start = +$("rg").value;
  const q = $("q").value.trim().toLowerCase();

  shown = W.filter(x =>
    (!start || (x.n >= start && x.n < start+40)) &&
    (!q || x.w.toLowerCase().includes(q) || x.z.toLowerCase().includes(q))
  );

  L.innerHTML = shown.map(x => `
    <div class="cw">
      <button class="card" data-w="${x.w}">
        <span class="n">#${x.n}</span>
        <div class="w">${x.w}<span class="p">${x.p}</span></div>
        <div class="k"></div>
        <div class="z">${x.z}</div>
        <div class="s" data-i="${x.n}">🔊 ${x.s}<span class="sz">${x.z}</span></div>
      </button>
      <label class="ck" title="加入PDF">
        <input type="checkbox" data-n="${x.n}" aria-label="選取 ${x.w}" ${selected.has(x.n)?"checked":""}>
      </label>
    </div>
  `).join("") || "<p>找不到符合的單字</p>";

  count();
}

function speak(text, el) {
  if (!("speechSynthesis" in window)) {
    $("msg").textContent = "目前瀏覽器不支援語音朗讀，請使用 Safari、Chrome 或 Edge。";
    return;
  }
  speechSynthesis.cancel();
  document.querySelectorAll(".card.on").forEach(c => c.classList.remove("on"));
  el.classList.add("on");

  const u = new SpeechSynthesisUtterance(text);
  u.lang = accent;
  u.rate = +$("sp").value;
  u.onend = u.onerror = () => el.classList.remove("on");
  speechSynthesis.speak(u);
}

L.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const sentence = e.target.closest(".s");
  const item = W[Number(sentence?.dataset.i || W.find(x=>x.w===card.dataset.w).n)-1];
  speak(sentence ? item.s : item.w, card);
});

[["us","en-US"],["uk","en-GB"]].forEach(([id,lang]) => {
  $(id).onclick = () => {
    accent = lang;
    $("us").setAttribute("aria-pressed", lang==="en-US");
    $("uk").setAttribute("aria-pressed", lang==="en-GB");
  };
});

$("zh").onchange = e => document.body.classList.toggle("nozh", !e.target.checked);
$("se").onchange = e => document.body.classList.toggle("nose", !e.target.checked);
$("kk").onchange = e => document.body.classList.toggle("nokk", !e.target.checked);

L.addEventListener("change", e => {
  const n = +e.target.dataset.n;
  if (!n) return;
  e.target.checked ? selected.add(n) : selected.delete(n);
  count();
});

$("sa").onclick = () => { shown.forEach(x=>selected.add(x.n)); render(); };
$("sall").onclick = () => {
  W.forEach(x=>selected.add(x.n));
  render();
  $("msg").textContent = "已全選 150 個單字。";
};
$("sc").onclick = () => { selected.clear(); render(); };

function rangeAction(add) {
  let a = parseInt($("ra").value), b = parseInt($("rb").value);
  if (isNaN(a) && isNaN(b)) {
    $("msg").textContent = "請輸入起始與結束編號。";
    return;
  }
  if (isNaN(a)) a=b;
  if (isNaN(b)) b=a;
  if (a>b) [a,b]=[b,a];
  a=Math.max(1,a); b=Math.min(150,b);
  let changed=0;

  for (let i=a;i<=b;i++) {
    if (add && !selected.has(i)) { selected.add(i); changed++; }
    if (!add && selected.has(i)) { selected.delete(i); changed++; }
  }
  if (add) { $("rg").value="0"; $("q").value=""; }
  render();
  $("msg").textContent =
    `${add?"已加入":"已取消"} ${changed} 個單字（${a}–${b}），目前選取 ${selected.size} 個。`;
}
$("radd").onclick = () => rangeAction(true);
$("rdel").onclick = () => rangeAction(false);
$("rg").onchange = render;
$("q").oninput = render;

function makePrintContent() {
  const includeZh=$("pz").checked, includeSent=$("ps").checked;
  const items=W.filter(x=>selected.has(x.n));
  $("pv").innerHTML = `
    <h2>G2-Advanced S11/S12 Vocabulary</h2>
    <p>共 ${items.length} 個單字</p>
    <table>
      <tr><th>#</th><th>Word</th><th>詞性</th>
      ${includeZh?"<th>中文</th>":""}
      ${includeSent?"<th>Example Sentence</th>":""}</tr>
      ${items.map(x=>`<tr>
        <td>${x.n}</td><td><b>${x.w}</b></td><td>${x.p}</td>
        ${includeZh?`<td>${x.z}</td>`:""}
        ${includeSent?`<td>${x.s}${includeZh?`<br>${x.z}`:""}</td>`:""}
      </tr>`).join("")}
    </table>`;
}

$("pd").onclick = () => {
  if (!selected.size) {
    $("msg").textContent = "請先勾選要匯出的單字，或按「全選目前範圍」。";
    return;
  }
  makePrintContent();
  $("msg").textContent = "在列印視窗中，選擇「另存為 PDF」。";
  window.print();
};

render();
</script>
</body>
</html>
